# Let the dongie user read Tailscale prefs and switch `tailscale serve`
# (HTTPS on the tailnet; never Funnel) from its dashboard. Re-applied at every
# tailscaled start; harmless before the first `tailscale up` (tested). A later
# `tailscale up` with other flags needs --operator=dongie added (or use
# `tailscale set`), Tailscale's error message says so.
[Service]
ExecStartPost=-/usr/bin/tailscale set --operator=dongie
