# dongie's VoWiFi switch: "off" in the web UI writes this marker, and then
# systemd doesn't start dongie-ims (at boot or otherwise). dongie removes it
# again when VoWiFi is turned on. Assumes the default state_dir.
[Unit]
ConditionPathExists=!/var/lib/dongie/vowifi-off
